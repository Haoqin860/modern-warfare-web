<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A/B Preset Compare</title>
<style>
  body { margin:0; background:#111; display:flex; height:100vh; font-family:monospace; }
  iframe { flex:1; border:none; }
  .label { position:fixed; top:10px; color:#fff; background:rgba(0,0,0,0.8); padding:4px 12px; font-size:14px; z-index:100; pointer-events:none; }
  .label-a { left:10px; }
  .label-b { left:50vw; margin-left:10px; }
</style>
</head>
<body>
<div class="label label-a">PRESET A (warm, bloom=0.95)</div>
<div class="label label-b">PRESET B (cool, contrast=1.12)</div>
<iframe src="http://localhost:5173/?preset=A"></iframe>
<iframe src="http://localhost:5174/?preset=B"></iframe>
</body>
</html>
